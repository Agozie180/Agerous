<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGEROUS</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- 3D Canvas -->
    <canvas id="world-canvas"></canvas>

    <!-- HUD Top Bar -->
    <div id="hud-top">
      <div id="brand">AGEROUS</div>
      <div id="clock-display">
        <span id="day-label">DAY 1</span>
        <span id="time-label">08:00</span>
      </div>
      <div id="weather-display">
        <span id="weather-icon">☀</span>
        <span id="weather-label">Clear</span>
      </div>
    </div>

    <!-- Event Input Panel -->
    <div id="event-panel">
      <div id="event-panel-title">What should happen in the world?</div>
      <div id="scenario-chips" aria-label="Quick scenarios">
        <button class="scenario-chip" data-event="A severe flood is coming">Flood</button>
        <button class="scenario-chip" data-event="The local election is tomorrow">Election</button>
        <button class="scenario-chip" data-event="School is closed tomorrow">School closure</button>
        <button class="scenario-chip" data-event="A large food shipment arrived">Market shipment</button>
        <button class="scenario-chip" data-event="Sunday service this morning">Church service</button>
      </div>
      <textarea id="event-input" placeholder="e.g. A severe flood is coming..." rows="2"></textarea>
      <div id="event-actions">
        <button id="simulate-btn">SIMULATE</button>
        <span id="sim-status"></span>
      </div>
    </div>

    <!-- Status Panel -->
    <div id="status-panel" aria-live="polite"></div>

    <!-- History Panel -->
    <div id="history-panel">
      <div id="history-title">WORLD HISTORY</div>
      <div id="history-list"></div>
    </div>

    <!-- Active Events Ticker -->
    <div id="active-events-bar">
      <span id="active-events-label">ACTIVE: </span>
      <span id="active-events-text">Normal day</span>
    </div>

    <!-- NPC Info Tooltip -->
    <div id="npc-tooltip" class="hidden">
      <div id="npc-tooltip-name"></div>
      <div id="npc-tooltip-info"></div>
    </div>

    <!-- API Key modal (shown if no key in localStorage) -->
    <div id="api-modal" class="hidden">
      <div id="api-modal-box">
        <div id="api-modal-title">AGEROUS Setup</div>
        <p>Enter your OpenAI API key to enable event interpretation.<br/>
        The key is stored only in your browser's localStorage.</p>
        <input type="password" id="api-key-input" placeholder="sk-..." />
        <button id="api-key-save">Save &amp; Start</button>
        <p style="font-size:11px;opacity:0.5;margin-top:8px;">
          Without a key, events will use a built-in rule-based fallback.
        </p>
        <button id="api-key-skip">Continue without API key</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
